[project]
name = "streamlingo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.2",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "numpy>=2.4.3",
    "openai>=2.30.0",
    "pydantic>=2.12.5",
    "sounddevice>=0.5.5",
    "uvicorn[standard]>=0.42.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.basedpyright]
extraPaths = ["backend"]
